# White-light pB for a synthetic FULL DISK.
#   python examples/generate_synthetic_data.py
#   rrt-wl examples/configs/wl_fulldisk_synth.yaml
data:
  density: examples/data/synth_fulldisk.h5
  input_case: auto
image:
  Npix: 256
  Rmax: 5.0
views:
  - {label: Side view, phi_obs_deg: -70, B0_deg: 0}
  - {label: Pole view, phi_obs_deg: -70, B0_deg: 89}
white_light:
  Rocc: 1.0
  U_LIMB: 0.63
  SIGMA_T: 7.95e-26        # r_e^2 [cm^2] (van de Hulst/Billings)
  nrgf: false
output_dir: out/wl_fulldisk_synth
