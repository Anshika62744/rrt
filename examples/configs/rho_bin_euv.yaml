# EUV / AIA 171 for the MAS full-disk data (rho_bin.h5 + t_bin.h5).
# Put both files in the data/ folder, then:  rrt-euv examples/configs/rho_bin_euv.yaml
data:
  density: data/rho_bin.h5
  temperature: data/t_bin.h5
  fmt: mas
  ne_scale: 1.0e+8            # MAS code-unit density -> cm^-3
  t_scale: 2.807e+7          # MAS code-unit temperature -> K
  r_range: [1.03, 5.0]
response: data/aia_temp_response_chiantifix.npz
wavelength: 171
image: {Npix: 400, Rmax: 1.5}
views:
  - {label: Equatorial, phi_obs_deg: -70, B0_deg: 0}
  - {label: Pole,       phi_obs_deg: -70, B0_deg: 89}
output_dir: out/rho_bin_euv
