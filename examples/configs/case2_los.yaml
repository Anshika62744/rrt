# Test case 2 — single line-of-sight diagnostics for the ARMS wedge
# mhd_data_0220.h5 (density only -> isothermal, so R(T) is a constant).
#   rrt-los examples/configs/case2_los.yaml
data:
  density: data/mhd_data_0220.h5
  input_case: auto
  t_iso: 1.0e+6
  nghost: auto
response: data/aia_temp_response_chiantifix.npz
wavelength: 171
scale: log                 # log | linear  intensity scale
image: {Npix: 256, Rmax: 3.0}
views:
  - {label: Side view, phi_obs_deg: -70, B0_deg: 0}
# The wedge covers only part of the sky: at this viewpoint a ray needs X >~ 0.15
# to enter the domain at all, so probes must be chosen to match (see notebook 03).
los: {probes: [[1.2, 0.0], [1.5, 0.0], [0.99, 0.22]]}
output_dir: out/case2_los
