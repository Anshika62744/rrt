# Test case 2 — white-light pB for the ARMS wedge mhd_data_0220.h5.
# Density is already in cm^-3, so no ne_scale; temperature is irrelevant for pB.
#   rrt-wl examples/configs/arms_wedge_wl.yaml
data:
  density: data/mhd_data_0220.h5
  input_case: auto
  nghost: auto
#scale: log                 # log | linear  intensity scale
scale: linear
image: {Npix: 256, Rmax: 5.0}
views:
  - {label: Side view, phi_obs_deg: -70, B0_deg: 0}
white_light: {Rocc: 1.0, U_LIMB: 0.63, SIGMA_T: 7.95e-26, nrgf: true}
output_dir: out/arms_wedge_wl
