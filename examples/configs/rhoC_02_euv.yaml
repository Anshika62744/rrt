# Test case 3 — MAS/PSI full shell: rhoC_02.h5 (density) + t02.h5 (temperature).
# Same layout and normalisation as test case 1, different snapshot.
#   rrt-euv examples/configs/rhoC_02_euv.yaml
#   rrt-los examples/configs/rhoC_02_euv.yaml     (uses the los: block below)
data:
  density: data/rhoC_02.h5
  temperature: data/t02.h5
  fmt: mas
  ne_scale: 1.0e+8           # MAS code-unit density -> cm^-3
  t_scale: 2.807e+7          # MAS code-unit temperature -> K
  r_range: [1.03, 5.0]
response: data/aia_temp_response_chiantifix.npz
wavelength: 171
vlim_log: [0.5, 4.0] 
scale: log                 # log | linear  intensity scale
image: {Npix: 256, Rmax: 1.5}
views:
  - {label: earth,     obs_time: '2024-05-08T14:09:00'}
  - {label: earth_top, obs_time: '2024-05-08T14:09:00', pole: north}
los: {probes: [[1.5, 0.3], [0.5, 0.0], [2.5, 0.0]]}
output_dir: out/rhoC_02_euv

