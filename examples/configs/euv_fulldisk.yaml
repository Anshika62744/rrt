# Synthetic EUV/AIA for a full-disk MAS/PSI cube (separate density + temperature
# files, code units converted via ne_scale / t_scale).
#   rrt-euv examples/configs/euv_fulldisk.yaml
data:
  density: data/rhoC_02.h5         # MAS "Data" + dim1/2/3 layout
  temperature: data/t02.h5         # separate temperature file → input_case=separate
  fmt: mas
  ne_scale: 1.0e8                  # MAS n0  [cm^-3]
  t_scale: 2.807e7                 # MAS T0  [K]
  r_range: [1.03, 5.0]             # trim the dense chromosphere
response: data/aia_temp_response_chiantifix.npz
wavelength: 171
image:
  Npix: 512
  Rmax: 1.5
views:
  # MAS cubes are Carrington-framed, so an observation time gives the real
  # sub-Earth viewpoint (L0 = Carrington longitude, B0 = latitude, via sunpy).
  - {label: sub-Earth, obs_time: '2024-05-08T14:09:00'}
  # ...or set the angles explicitly:
  # - {label: Equatorial, phi_obs_deg: -70, B0_deg: 0}
output_dir: out/euv_fulldisk
