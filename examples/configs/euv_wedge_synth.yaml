# EUV for a synthetic WEDGE (run examples/generate_synthetic_data.py first).
#   rrt-euv examples/configs/euv_wedge_synth.yaml
data:
  density: examples/data/synth_wedge.h5   # density-only → isothermal
  input_case: auto
  t_iso: 1.0e+6
response: examples/data/synth_response.npz
wavelength: 171
scale: log                 # log | linear  intensity scale
image:
  Npix: 256
  Rmax: 1.5
views:
  - {label: Side view, phi_obs_deg: -70, B0_deg: 0}
  - {label: Nose view, phi_obs_deg: -70, B0_deg: 89}
output_dir: out/euv_wedge_synth
