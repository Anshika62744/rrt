# Conda environment for the rrt package.
#   conda env create -f environment.yml
#   conda activate rrt
# Tested on Python 3.11. Version floors match pyproject.toml;
name: rrt
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.23
  - numba>=0.57
  - h5py>=3.7
  - matplotlib>=3.6
  - sunpy>=4.1
  - astropy>=5.1
  - pyyaml>=6.0
  - imageio-ffmpeg>=0.4
  - pytest>=7.0
  - jupyter
  - ipykernel
  - pip
  - pip:
      - -e .
